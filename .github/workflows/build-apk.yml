name: Build aapka sathi Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # No package-lock.json in the repo, so use npm install (npm ci needs a lockfile).
      # @capacitor/android is now pinned to ^7 in package.json, matching core and cli.
      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aapka-sathi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
